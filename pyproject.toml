# uv workspace root (not a package itself). Members live in packages/.
[project]
name = "movebot-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = ["movebot"]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "opencv-python-headless>=4.9",
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "tomli>=2.0 ; python_full_version < '3.11'",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/movebot"]

[tool.uv.sources]
movebot = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/movebot/tests", "protocol/conformance"]
timeout = 60
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # keep hand-aligned examples in docs untouched

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ° and similar characters in strings/comments

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E402"]  # imports after pytest.importorskip(...)
